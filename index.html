<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geo Tag Generator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>#map{height:320px;border-radius:8px;z-index:0}
:root{--bg:#f6f6f4;--fg:#1c1c1a;--card:#fff;--bd:#d8d8d2;--ac:#1a6b4a}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eee;--card:#222220;--bd:#3a3a36;--ac:#4cc08a}}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;max-width:720px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;opacity:.7;margin:8px 0 2px}
input,button{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.sec{background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.res{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px}.res:hover{background:var(--bg)}
canvas{width:100%;height:auto;border-radius:8px;display:block;background:#888}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px}.chk input{width:auto}
</style></head><body>
<h1>Geo Tag Generator</h1>

<div class="card">
<label>1. Photo (any ratio)</label>
<input type="file" id="file" accept="image/*">
<label>2. Search location</label>
<div class="row"><input id="q" placeholder="e.g. Kunnonny, Kerala"><button id="go" style="flex:0 0 90px">Search</button></div>
<button id="loc" class="sec" style="margin-top:8px">📍 Use my current location</button>
<div id="locmsg" style="font-size:12px;opacity:.75;margin-top:6px"></div>
<div id="results"></div>
</div>

<div class="card"><label style="margin-top:0">Tap on the map to pick the spot (switch to Satellite with the layers icon)</label><div id="map"></div><div id="mapmsg" style="font-size:12px;opacity:.75;margin-top:6px"></div></div>

<div class="card">
<label>Place title</label><input id="title" value="Kunnonny, Kerala, India">
<label>Address line (code, place, PIN, country)</label><input id="addr" value="Mr3p+cpm, Kunnonny, Kerala 686582, India">
<div class="row"><div><label>Latitude</label><input id="lat" value="9.653725"></div><div><label>Longitude</label><input id="lng" value="76.837063"></div></div>
<div class="row"><div><label>Date &amp; time</label><input id="dt" type="datetime-local"></div><div><label>GMT offset</label><input id="tz" value="+05:30"></div></div>
<label>Note line (leave empty to hide)</label><input id="note" value="Note : Captured by GPS Map Camera">
<div class="row"><div><label>Map zoom</label><input id="zoom" type="range" min="14" max="19" value="17"></div><div><label>Stamp size</label><input id="scale" type="range" min="70" max="130" value="100"></div></div>
<label>Map cone direction</label><input id="cone" type="range" min="0" max="359" value="180">
<div class="chk"><input type="checkbox" id="flag" checked><span>Show India flag</span></div>
</div>

<div class="card"><canvas id="cv" width="800" height="450"></canvas>
<div class="row" style="margin-top:10px"><button id="dl">Download JPG</button></div></div>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
let img=null,token=0;const tiles={};
function pad(n){return String(n).padStart(2,'0')}
(function(){const d=new Date();$('dt').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())})();

$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{img=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(_){img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)})}
 render()};
['title','addr','note','lat','lng','dt','tz','zoom','scale','cone','flag'].forEach(i=>$(i).addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(render,150)}));


$('loc').onclick=()=>{const msg=$('locmsg');
 if(!navigator.geolocation||!window.isSecureContext){msg.textContent=!window.isSecureContext?'Your browser blocks location for files opened from WhatsApp or Files. Host this page on https (GitHub Pages or Netlify) to use this button, or type the latitude and longitude below.':'Location is not supported in this browser.';return}
 msg.textContent='Getting your location…';
 navigator.geolocation.getCurrentPosition(async pos=>{
  const la=pos.coords.latitude,lo=pos.coords.longitude;
  $('lat').value=la.toFixed(6);$('lng').value=lo.toFixed(6);
  const d=new Date();$('dt').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  const off=-d.getTimezoneOffset(),sg=off>=0?'+':'-';$('tz').value=sg+pad(Math.floor(Math.abs(off)/60))+':'+pad(Math.abs(off)%60);
  try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat='+la+'&lon='+lo);const j=await r.json();
   if(j&&j.address){pick({...j,lat:la,lon:lo});msg.textContent='Location, date and time updated. Check the place name and edit if needed.';return}}catch(e){}
  msg.textContent='Coordinates, date and time updated, but the place name could not be fetched. Type it in or use Search.';render()},
 err=>{if(!window.isSecureContext){msg.textContent='Your browser blocks location for files opened from WhatsApp or Files. Host this page on https (GitHub Pages or Netlify) to use this button, or type the latitude and longitude below.';return}msg.textContent=err.code===1?'Permission denied. Allow location access for this page in your browser settings.':'Could not get location ('+err.message+'). Try again outdoors or with GPS on.'},
 {enableHighAccuracy:true,timeout:20000,maximumAge:0})};

let map,marker;
function syncMap(){if(!map)return;const la=parseFloat($('lat').value),lo=parseFloat($('lng').value);if(isNaN(la)||isNaN(lo))return;marker.setLatLng([la,lo]);map.setView([la,lo],Math.max(map.getZoom(),15))}
async function setPoint(la,lo){$('lat').value=la.toFixed(6);$('lng').value=lo.toFixed(6);marker.setLatLng([la,lo]);const mm=$('mapmsg');mm.textContent='Looking up the place name…';
 try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat='+la+'&lon='+lo);const j=await r.json();
  if(j&&j.address){pick({...j,lat:la,lon:lo});mm.textContent='Spot selected. Check the place name and address, and edit if needed.';return}}catch(e){}
 mm.textContent='Spot selected, but the place name could not be fetched. Type it in.';render()}
function initMap(){if(typeof L==='undefined'){$('mapmsg').textContent='Map could not load. Check your internet connection.';return}
 const la=parseFloat($('lat').value)||9.65,lo=parseFloat($('lng').value)||76.83;
 map=L.map('map').setView([la,lo],15);
 const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}),
  sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
 osm.addTo(map);L.control.layers({'Street':osm,'Satellite':sat}).addTo(map);
 marker=L.circleMarker([la,lo],{radius:9,color:'#fff',weight:3,fillColor:'#e8312f',fillOpacity:1}).addTo(map);
 map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng));
 ['lat','lng'].forEach(i=>$(i).addEventListener('change',syncMap))}
$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};
async function search(){const q=$('q').value.trim();if(!q)return;const box=$('results');box.innerHTML='<div class="res">Searching…</div>';
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q='+encodeURIComponent(q));
  const j=await r.json();box.innerHTML='';if(!j.length){box.innerHTML='<div class="res">No results</div>';return}
  j.forEach(p=>{const d=document.createElement('div');d.className='res';d.textContent=p.display_name;d.onclick=()=>{pick(p);box.innerHTML=''};box.appendChild(d)})
 }catch(e){box.innerHTML='<div class="res">Search failed. Check your internet connection.</div>'}}
function pick(p){const a=p.address||{};
 const place=a.village||a.town||a.city||a.hamlet||a.suburb||a.county||p.name||'';
 const state=a.state||'',country=a.country||'',pin=a.postcode||'';
 const code=(($('addr').value.split(',')[0]||'').includes('+'))?$('addr').value.split(',')[0]:'';
 $('title').value=[place,state,country].filter(Boolean).join(', ');
 $('addr').value=[code,place,(state+' '+pin).trim(),country].filter(Boolean).join(', ');
 $('lat').value=(+p.lat).toFixed(6);$('lng').value=(+p.lon).toFixed(6);
 $('flag').checked=country==='India';syncMap();render()}

function loadTile(z,x,y){const u=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
 return tiles[u]||(tiles[u]=new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u}))}

function rr(c,x,y,w,h,r){if(typeof r==='number')r=[r,r,r,r];c.beginPath();c.moveTo(x+r[0],y);c.lineTo(x+w-r[1],y);c.quadraticCurveTo(x+w,y,x+w,y+r[1]);c.lineTo(x+w,y+h-r[2]);c.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);c.lineTo(x+r[3],y+h);c.quadraticCurveTo(x,y+h,x,y+h-r[3]);c.lineTo(x,y+r[0]);c.quadraticCurveTo(x,y,x+r[0],y);c.closePath()}

async function drawMap(c,x,y,S,lat,lng,z,dir,rad){
 c.save();rr(c,x,y,S,S,rad);c.clip();c.fillStyle='#1f3b2a';c.fillRect(x,y,S,S);
 try{const n=2**z,px=(lng+180)/360*n*256,sin=Math.sin(lat*Math.PI/180),py=(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*n*256,R=360,x0=px-R/2,y0=py-R/2,k=S/R,jobs=[];
 for(let tx=Math.floor(x0/256);tx<=Math.floor((px+R/2)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((py+R/2)/256);ty++)jobs.push(loadTile(z,tx,ty).then(im=>({im,tx,ty})));
 (await Promise.all(jobs)).forEach(t=>{if(t.im)c.drawImage(t.im,x+(t.tx*256-x0)*k,y+(t.ty*256-y0)*k,256*k+1,256*k+1)})}catch(e){}
 const cx=x+S/2,cy=y+S/2,a=dir*Math.PI/180,L=S*.3,sp=.5;
 c.fillStyle='rgba(70,115,230,.65)';c.beginPath();c.moveTo(cx,cy);
 c.lineTo(cx+Math.sin(a-sp)*L,cy-Math.cos(a-sp)*L);c.lineTo(cx+Math.sin(a+sp)*L,cy-Math.cos(a+sp)*L);c.fill();
 const ph=S*.21,pw=ph*.62;c.fillStyle='#e8312f';c.beginPath();c.moveTo(cx,cy);
 c.bezierCurveTo(cx-pw*.9,cy-ph*.45,cx-pw*.62,cy-ph,cx,cy-ph);c.bezierCurveTo(cx+pw*.62,cy-ph,cx+pw*.9,cy-ph*.45,cx,cy);c.fill();
 c.fillStyle='#6b0a0a';c.beginPath();c.arc(cx,cy-ph*.66,pw*.3,0,7);c.fill();
 c.font=`bold ${S*.195}px Arial,sans-serif`;c.textBaseline='alphabetic';c.lineJoin='round';
 c.strokeStyle='#111';c.lineWidth=S*.045;c.strokeText('Google',x+S*.09,y+S*.83);c.fillStyle='#fff';c.fillText('Google',x+S*.09,y+S*.83);
 c.restore()}

function flagIco(c,x,y,w,h){c.save();rr(c,x,y,w,h,h*.08);c.clip();c.fillStyle='#ff9933';c.fillRect(x,y,w,h/3);c.fillStyle='#fff';c.fillRect(x,y+h/3,w,h/3);
 c.fillStyle='#138808';c.fillRect(x,y+2*h/3,w,h/3);c.restore();c.strokeStyle='#000080';c.lineWidth=h*.03;c.beginPath();c.arc(x+w/2,y+h/2,h*.13,0,7);c.stroke()}

function wrap(c,t,max){const w=t.split(' '),out=[];let cur='';w.forEach(x=>{const tr=cur?cur+' '+x:x;if(cur&&c.measureText(tr).width>max){out.push(cur);cur=x}else cur=tr});if(cur)out.push(cur);return out}

function dateText(){const v=$('dt').value;if(!v)return '';const d=new Date(v),days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;
 return `${days[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(h)}:${pad(d.getMinutes())} ${ap} GMT ${$('tz').value}`}

async function render(){
 const my=++token;if(!img){ctx.fillStyle='#777';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('Upload a photo to begin',280,225);return}
 let W=img.width,H=img.height;const cap=4000,s0=Math.min(1,cap/Math.max(W,H));W=Math.round(W*s0);H=Math.round(H*s0);
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
 const por=H>W,u=Math.min(W,H)*$('scale').value/100,m=(por?.0362:.0965)*W,bot=.0195*Math.min(W,H);
 const tF=.0475*u,f=.0297*u,gap1=.0415*u,pitch=.0355*u,capT=.034*u,desc=.006*u,pd=.0193*u,gap=.0185*u;
 const lat=parseFloat($('lat').value)||0,lng=parseFloat($('lng').value)||0;
 const title=$('title').value,showFlag=$('flag').checked,note=$('note').value.trim();
 let S=.2575*u,lines,block;
 for(let i=0;i<2;i++){const boxW=W-m-(m+S+gap),mw=boxW-2*pd;x.font=`400 ${f}px ${FF}`;
  lines=wrap(x,$('addr').value,mw).concat([`Lat ${+lat.toFixed(6)}° Long ${+lng.toFixed(6)}°`,dateText()]);if(note)lines.push(note);
  block=capT+gap1+(lines.length-1)*pitch+desc;if(block+.04*u>S)S=block+.04*u;else break}
 const boxX=m+S+gap,boxW=W-m-boxX,boxY=H-bot-S,mw=boxW-2*pd,rad=.0125*u;
 await drawMap(x,m,boxY,S,lat,lng,+$('zoom').value,+$('cone').value,rad);
 if(my!==token)return;
 x.fillStyle='rgba(32,28,27,.86)';rr(x,boxX,boxY,boxW,S,rad);x.fill();
 const bw=.18*u,bh=.047*u,bx=boxX+boxW-bw,by=boxY-bh;rr(x,bx,by,bw,bh+2,[.0124*u,.0124*u,0,0]);x.fill();
 const ic=.029*u,ix=bx+.009*u,iy=by+(bh-ic)/2;x.imageSmoothingQuality='high';if(ICON.complete&&ICON.naturalWidth)x.drawImage(ICON,ix,iy,ic,ic);
x.fillStyle='#fff';x.font=`400 ${.0152*u}px ${FF}`;x.textBaseline='alphabetic';x.fillText('GPS Map Camera',bx+.0476*u,by+bh/2+.0055*u);
 const tx=boxX+pd;let base=boxY+(S-block)/2+.0083*u+capT;
 let tp=tF;x.font=`400 ${tp}px ${FF}`;const fw=showFlag?.055*u+.0166*u:0;while(x.measureText(title).width>mw-fw&&tp>8){tp--;x.font=`400 ${tp}px ${FF}`}
 x.fillStyle='#fff';x.fillText(title,tx,base);
 if(showFlag&&FLAG.complete&&FLAG.naturalWidth){const fw2=.0553*u,fh2=fw2*122/162;x.drawImage(FLAG,tx+x.measureText(title).width+.0166*u,base-.0366*u,fw2,fh2)}
x.font=`400 ${f}px ${FF}`;base+=gap1;lines.forEach((t,i)=>{if(i)base+=pitch;x.fillStyle='#fff';x.fillText(t,tx,base)});
 cv.width=W;cv.height=H;ctx.drawImage(c,0,0)}

$('dl').onclick=()=>{if(!img){alert('Upload a photo first');return}
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='geotagged_'+Date.now()+'.jpg';a.click()},'image/jpeg',.95)};
initMap();render();
